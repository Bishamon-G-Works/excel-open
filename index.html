<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Excelを開いています</title>
<style>
  :root { --bg:#f6f7f9; --text:#1d2330; --muted:#5b6475; --link:#1d6f42; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --text:#e8eaef; --muted:#a3aab8; --link:#3fa36b; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Yu Gothic UI","Meiryo",sans-serif; }
  main { max-width:640px; margin:48px auto; padding:0 16px; }
  p { margin:8px 0; line-height:1.7; }
  .sub { color:var(--muted); font-size:13px; }
  a { color:var(--link); }
</style>
</head>
<body>
<main>
  <p id="msg">開くファイルが指定されていません。SFAのリンクから開いてください。</p>
  <p class="sub" id="sub"></p>
</main>
<script>
(function () {
  // パスはリンクの # 以降で受け取る（# 以降はサーバーに送られない）
  // 例: #//server/share/folder/FILE~1.XLS  →  ms-excel:file://server/share/folder/FILE~1.XLS
  var raw = location.hash.replace(/^#/, "");
  if (!raw) return;
  var path;
  try { path = decodeURIComponent(raw); } catch (e) { path = raw; }
  path = path.trim().replace(/\\/g, "/");
  var msg = document.getElementById("msg");
  if (!/^\/\/[^\/]+\/.+\.xlsx?$/i.test(path)) {
    msg.textContent = "リンクの形式が正しくありません。SFAのリンクをもう一度確認してください。";
    return;
  }
  // 「|」「\」はブラウザが %7C・%5C に変換してOfficeが読めなくなるため、記号なしの短縮形と「/」区切りにする
  var url = "ms-excel:file:" + path;
  msg.textContent = "Excelを開いています…";
  var sub = document.getElementById("sub");
  sub.innerHTML = '開かないときは <a id="go">こちら</a> を押してください。';
  document.getElementById("go").href = url;
  location.href = url;
})();
</script>
</body>
</html>
